name: CI / CD

# CI runs on every push and pull request.
# CD: a push to `main` that passes every check is deployed to Cloudflare Workers.
on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    # Only after all checks pass, only for pushes to main (never for PRs or other branches).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://chalkline-tutor.ravi-khatri-studio.workers.dev
    # Never run two deploys at once; a newer push waits for the current deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Stored as encrypted GitHub Actions secrets, never in the repository.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Build and deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        run: |
          # Strip whitespace/newlines that easily sneak in when pasting secrets.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npm run deploy
      - name: Smoke-check the live site
        if: steps.creds.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://chalkline-tutor.ravi-khatri-studio.workers.dev/api/health
          curl --fail --silent --show-error -o /dev/null https://chalkline-tutor.ravi-khatri-studio.workers.dev/
